[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "dice-robustness"
version = "0.1.0"
description = "Refactored DiCE robustness project"
requires-python = ">=3.9"
authors = [ {name = "Research Team", email = "research@example.com"} ]
license = {text = "MIT"}
readme = "README.md"

[project.dependencies]
# Core scientific python stack
numpy = "*"
scipy = "*"
torch = ">=2.0"
torchvision = "*"
timm = "*"
# data / evaluation helpers
matplotlib = "*"
seaborn = "*"
scikit-learn = "*"
PyYAML = "*"
# external models
diffusers = "*"
transformers = "*"
# datasets hub
datasets = "*"
# segmentation models
segment-anything = "*"
