[project]
name = "meta-mpnn-refactor"
version = "0.1.0"
authors = [
  { name = "Research Engineer", email = "research@example.com" }
]
description = "Refactored project structure for Meta-MPNN experiments"
requires-python = ">=3.9"

dependencies = [
  "torch",
  "torch-geometric",
  "torch-sparse",
  "huggingface_hub",
  "PyYAML",
  "matplotlib",
  "numpy",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.extra-build-dependencies]
# Ensure torch is pre-installed inside the isolated build env when building
# wheels for torch-sparse.  This prevents the "ModuleNotFoundError: torch"
# observed during wheel compilation.
torch-sparse = ["torch"]
