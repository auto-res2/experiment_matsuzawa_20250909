[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c3d"
version = "0.1.0"
description = "Causal Diffusion Discovery & Debiasing experiments"
authors = [ { name = "Researcher" } ]
requires-python = ">=3.9"
license = { text = "MIT" }

# Core runtime dependencies ------------------------------------------------------
[project.dependencies]
torch = "*"
torchvision = "*"
datasets = "*"
diffusers = "*"
transformers = "*"
timm = "*"
matplotlib = "*"
seaborn = "*"
scikit-learn = "*"
PyYAML = "*"
