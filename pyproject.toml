[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "dice-ood-robustness"
version = "0.1.0"
description = "Refactored research code for DiCE OOD robustness experiments"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Researcher", email = "research@example.com"}]
requires-python = ">=3.9"

# -----------------------------------------------------------------------------
# Dependencies – copied from the import list of the original single script
# -----------------------------------------------------------------------------

dependencies = [
    "torch>=2.0",
    "torchvision",
    "timm",
    "datasets",
    "diffusers",
    "transformers",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["."]
