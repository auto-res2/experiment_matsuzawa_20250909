[project]
name = "c3d-research"
version = "0.1.0"
description = "Research code-base for C3D experiments (refactored)."
readme = "README.md"
requires-python = ">=3.9"

# -----------------------------------------------------------------------------
# Core dependencies – pinned loosely for GPU research environments
# -----------------------------------------------------------------------------
dependencies = [
    "torch>=2.0",
    "torchvision",
    "timm",
    "accelerate",
    "datasets",
    "diffusers",
    "transformers",
    "scikit-learn",
    "matplotlib",
    "captum",
    "pyyaml",
    "requests",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
