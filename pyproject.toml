[build-system]
requires = ["setuptools>=42", "wheel"]

[project]
name = "meta-mpnn"
version = "0.1.0"
description = "Research code – Meta-MPNN experiments"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Researcher", email = "research@example.com"}]

dependencies = [
  # Pinned versions chosen to avoid the massive CUDA-split wheels that inflate
  # download size and are unnecessary for CPU-only execution environments.
  "torch==2.1.2+cpu",
  "torch_geometric==2.5.3",
  "torch-scatter==2.1.2",
  "pyyaml",
  "matplotlib",
  "numpy"
]
