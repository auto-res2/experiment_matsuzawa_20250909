[project]
name = "hvq-regen-cl"
version = "0.1.0"
description = "Refactored experimental code for H-VQ ReGen continual-learning project"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

# Core dependencies extracted from import statements
[project.dependencies]
torch = ">=1.12"
torchvision = ">=0.13"
avalanche-lib = ">=0.4"
matplotlib = ">=3.5"
PyYAML = ">=6.0"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
