[project]
name = "dcd-split-project"
version = "0.1.0"
description = "Refactored Diffusion-based Counterfactual Debiasing codebase"
authors = [
  {name = "ML Researcher", email = "researcher@example.com"}
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "MIT"}

[project.dependencies]
# --- Core ML stack ---
torch = "*"
 torchvision = "*"
 torchmetrics = "*"
 timm = "*"
 datasets = "*"

# --- Plotting / utils ---
matplotlib = "*"
pyyaml = "*"

# Optional but recommended. Not imported by default but part of original code.
# diffusers = "*"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"