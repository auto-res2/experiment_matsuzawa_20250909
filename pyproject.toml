[build-system]
requires = ["setuptools>=42", "wheel"]

[project]
name = "meta-mpnn"
version = "0.1.0"
description = "Research code – Meta-MPNN experiments"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Researcher", email = "research@example.com"}]

dependencies = [
  # The CPU-only wheel is selected automatically when CUDA is unavailable.
  "torch==2.1.2",
  "torch_geometric==2.5.3",
  "torch-scatter==2.1.2",
  "torch-sparse==0.6.18",
  "pyyaml",
  "matplotlib",
  "numpy"
]

# -----------------------------------------------------------------------------
#  Build-time dependency hints for packages that need *Torch* during compilation
#  inside an isolated PEP-517 environment (required by `uv` / `pip`).
# -----------------------------------------------------------------------------
[tool.uv.extra-build-dependencies]
"torch-scatter" = ["torch"]
"torch-sparse"  = ["torch"]
