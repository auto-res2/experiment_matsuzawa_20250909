[project]
name = "hider"
version = "0.1.0"
description = "Reference implementation of HiDeR – Hierarchical Decoupled Replay"
requires-python = ">=3.9"
authors = [
  { name = "HiDeR Authors", email = "opensource@hider.org" }
]
license = { text = "Apache-2.0" }

# ---------------------------------------------------------------------------
#                            PROJECT DEPENDENCIES
# ---------------------------------------------------------------------------
# According to PEP 621, the ``dependencies`` field must be a sequence. Using a
# dedicated ``[project.dependencies]`` table – as in the previous version –
# results in a TOML parsing error ("invalid type: map, expected a sequence").
# The list below restores compliance with the spec while preserving the exact
# set of runtime requirements.

dependencies = [
    "torch>=2.2.2",
    "torchvision",
    "timm",
    "peft",
    "accelerate",
    "transformers",  # peft/accelerate dep
    "seaborn",
    "matplotlib",
    "datasets",
    "fvcore",
    "Pillow",
    "PyYAML"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
