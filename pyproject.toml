[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "dice-robustness"
version = "0.1.0"
description = "Refactored DiCE robustness project"
requires-python = ">=3.9"
authors = [ {name = "Research Team", email = "research@example.com"} ]
license = {text = "MIT"}
readme = "README.md"

# ---------------------------------------------------------------------------
#  PEP-621 compliant dependencies list – one string per requirement
# ---------------------------------------------------------------------------

dependencies = [
    # Core scientific python stack
    "numpy",
    "scipy",
    "torch>=2.0",
    "torchvision",
    "timm",
    # data / evaluation helpers
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "PyYAML",
    # datasets hub
    "datasets",
]

[tool.setuptools]
package-dir = {"" = "src"}
