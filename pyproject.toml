[build-system]
requires = ["setuptools>=42", "wheel"]

[project]
name = "grade_gnn_research"
version = "0.1.0"
description = "Refactored experimental benchmark for GRADE-GNN vs baseline GCN"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Anonymous Researcher"}
]

dependencies = [
  # CPU-only PyTorch to avoid large CUDA downloads
  "torch==2.2.0",
  "torch-geometric",
  "ogb",
  "matplotlib",
  "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
