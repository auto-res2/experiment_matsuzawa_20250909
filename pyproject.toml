[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grade_gnn_research"
version = "0.1.0"
description = "Research codebase for GRADE-GNN oversmoothing experiments"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Researcher", email = "research@gnn.ai" }
]

dependencies = [
  # Pin PyTorch to 2.0.1 to avoid automatic heavy CUDA dependency pulls that
  # can fail extraction in constrained environments while remaining compatible
  # with torch-geometric CPU wheels.
  "torch==2.0.1",
  "torch-geometric>=2.4.0",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "networkx>=3.2",
  # Pre-install curvature library. Though not used in baseline runs, it is
  # required for GRADE-GNN experiments.
  "GraphRicciCurvature==0.5.3.2",
]

[tool.setuptools.packages.find]
where = ["src"]
