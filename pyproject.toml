[project]
name = "adasmooth_ode"
version = "0.1.5"  # bumped after wheel URL removal & path update
description = "Depth-scalable GNNs with node-adaptive smoothing times (AdaSmooth-ODE)"
requires-python = ">=3.9"

# ---------------------------------------------------------------------------
# Dependency pinning strategy (wheel-only – *no local builds*)
# ---------------------------------------------------------------------------
# Direct URL wheels were returning *403 Forbidden*.  We therefore switch back
# to standard PyPI resolution which hosts pre-built wheels for the required
# packages.  All versions remain unchanged to preserve full compatibility
# with PyTorch 2.0.1.
# ---------------------------------------------------------------------------

dependencies = [
  # ---------- core ML stack ----------
  "numpy>=1.26,<2",          # explicit pin to avoid ABI mismatch
  "torch==2.0.1",            # CPU-only wheel (<250 MB) – stable & sufficient
  "torchvision==0.15.2",     # matching torch 2.0.x

  # ---------- PyG + compiled ops ----------
  "torch_sparse==0.6.17",    # install from PyPI (pre-built wheels)
  "torch_scatter==2.1.2",    # install from PyPI (pre-built wheels)
  "torch_geometric==2.4.0",  # pure-python, relies on wheels above

  # ---------- research helpers ----------
  "torchdiffeq", "ogb", "networkx", "scikit-learn",
  "seaborn", "matplotlib", "pyyaml", "tqdm"
]
