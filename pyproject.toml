[project]
name = "hvq-regen-cl"
version = "0.1.0"
description = "Refactored experimental code for H-VQ ReGen continual-learning project"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

dependencies = [
  "torch>=1.12",
  "torchvision>=0.13",
  # Avalanche 0.3.1 is the last version that does NOT have a hard dependency on
  # cvxpy>=1.4 (and therefore avoids pulling in the `proxsuite` wheel that lacks
  # Python 3.11 support). Using this older version is sufficient for the replay
  # strategy employed in these experiments.
  "avalanche-lib==0.3.1",
  # Pin cvxpy below 1.4 to avoid `proxsuite` transitive dependency.
  "cvxpy<1.4",
  "matplotlib>=3.5",
  "PyYAML>=6.0",
  "pytorchcv==0.0.73"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
