[project]
name = "hvqregen-cl"
version = "0.1.0"
description = "H-VQ ReGen: ultra-low-footprint rehearsal for continual learning"
requires-python = ">=3.8"
authors = [ {name = "OpenAI Assistant"} ]
license = {text = "Apache-2.0"}

# --------------------------------------------------------------------
#  Core dependencies  (ordered to avoid circular / optional extras)
# --------------------------------------------------------------------
[project.dependencies]
torch = ">=2.0"
torchvision = ">=0.15"
numpy = "*"
matplotlib = "*"
seaborn = "*"
pyyaml = "*"
fvcore = "*"

[build-system]
requires = ["setuptools", "wheel"]
