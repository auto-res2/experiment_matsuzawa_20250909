[project]
name = "hvq-regen-cl"
version = "0.1.0"
description = "Refactored experimental code for H-VQ ReGen continual-learning project"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}

dependencies = [
  "torch>=1.12",
  "torchvision>=0.13",
  # Avalanche 0.4.x pulls in cvxpy 1.4+, which in turn hard-depends on proxsuite
  # (no wheels for CPython 3.11). We therefore explicitly pin cvxpy to <1.4 and
  # relax Avalanche's version constraints to avoid the transitive dependency
  "avalanche-lib>=0.4",
  "cvxpy<1.4",
  "matplotlib>=3.5",
  "PyYAML>=6.0"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
