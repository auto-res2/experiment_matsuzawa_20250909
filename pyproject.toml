[build-system]
requires = ["setuptools>=42", "wheel"]

[project]
name = "grade_gnn_research"
version = "0.1.0"
description = "Refactored experimental benchmark for GRADE-GNN vs baseline GCN"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Anonymous Researcher"}
]

# ------------------------------------------------------------------
# Dependencies – array of strings as per PEP 621
# ------------------------------------------------------------------
dependencies = [
  # Core frameworks
  "torch",
  "torch-geometric",
  # OGB datasets
  "ogb",
  # Plotting & utilities
  "matplotlib",
  "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
