[build-system]
requires = ["setuptools>=42", "wheel"]

[project]
name = "grade_gnn_research"
version = "0.1.0"
description = "Refactored experimental benchmark for GRADE-GNN vs baseline GCN"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Anonymous Researcher"}
]

dependencies = [
  # Pin NumPy to <2 to avoid binary-compat issues with PyTorch/CuPy wheels
  "numpy<2",
  # Pandas 2.x requires NumPy>=2, so we pin pandas to <2 as it is not a critical dependency here
  "pandas<2",
  # Explicitly constrain SciPy to a version that has pre-built wheels for CPython 3.11
  "scipy>=1.10,<2",
  "torch==2.2.0",
  "torch-geometric",
  "ogb",
  "matplotlib",
  "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
