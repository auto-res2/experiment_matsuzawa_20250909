exp_waterbirds_quick:
  name: Waterbirds_Quick_Demo
  dataset:
    hf_name: grodino/waterbirds
    url: https://huggingface.co/datasets/grodino/waterbirds
    split_files: {}
  model:
    classifier_name: vit_base_patch16_224
    pretrained: true
    num_classes: 2
    clip_name: openai/clip-vit-large-patch14
    diffusion_name: stabilityai/stable-diffusion-2-inpainting
  train:
    epochs: 2          # shortened for quick execution in the testing environment
    batch_size: 32     # modest batch to avoid OOM on limited VRAM
    optimiser:
      lr: 0.0003
      weight_decay: 0.05
      betas:
      - 0.9
      - 0.999
    warmup_epochs: 1
    lambda_cer: 1.0
    refresh: 1
    prompts: 2         # fewer prompts → less CLIP compute
  seeds:
  - 0
