global:
  seed_list: [17, 31, 47]
  amp_dtype: "bfloat16"
  device: "cuda"
  log_level: "INFO"
  wandb:
    project: "DCD-ICLR2025"
    entity: null
  ddp:
    backend: "nccl"
    fsdp: true
    port: 54321

experiments:
  exp1_diff_waterbirds:
    dataset: "grodino/waterbirds"
    edited_splits: ["BG-Weak", "BG-Swap", "BG-Novel", "BG-Compound"]
    models: ["resnet50_mocov3", "vit_base_patch16_mocov3"]
    epochs: 70
    batch_size: 128
    optimiser:
      lr: 0.001
      weight_decay: 0.05
    dcd:
      enable: true
      topK: 64
      num_cf: 1
      guidance: 7.5
      clip_tau: 0.27

  exp2_causal_probe:
    dataset: "celeba_waterbirds_probe"
    models_ckpt: "outputs/exp1_diff_waterbirds/checkpoints"

  exp3_imagenet_fabs:
    dataset: "ILSVRC/imagenet-1k"
    models: ["vit_base_patch16_mocov3"]
    epochs: 90
    batch_size: 256
    optimiser:
      lr: 0.001
      weight_decay: 0.05
    dcd:
      enable: true
      topK: 64
      num_cf: 2
      guidance: 7.5
      clip_tau: 0.27
