# config/config.yaml
quick_mode: true

paths:
  root: ".research/iteration17"
  curvature: ".research/iteration17/curvature_cache"
  results: ".research/iteration17/results"
  figures: ".research/iteration17/figures"

# Full-benchmark details can be uncommented for exhaustive runs.
experiments:
  - name: full_benchmark
    datasets: ["Cora", "Citeseer", "Pubmed", "CoauthorCS", "Texas", "Wisconsin", "Chameleon", "ogbn-arxiv", "ogbn-products"]
    backbones:
      gcn2: {layers: 2, hidden: 256}
      gcn32: {layers: 32, hidden: 256}
      gcn64: {layers: 64, hidden: 256}
      gat4: {layers: 4, hidden: 128}
      gcnII64: {layers: 64, hidden: 256}
    methods: ["vanilla", "pairnorm", "borf", "ndls", "grade_grad_only", "grade_full"]
