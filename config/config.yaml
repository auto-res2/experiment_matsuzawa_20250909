exp1_rho0.9_resnet50:
  name: DistractImageNet++_rho0.9_resnet50
  dataset:
    hf_name: c3d/DistractImageNetPP
    url: https://huggingface.co/datasets/c3d/DistractImageNetPP
    split_files:
      train: splits/rho0p9/train_indices_seed0.json
      val: splits/rho0p9/val_indices_seed0.json
      test: splits/rho0p9/test_indices_seed0.json
  model:
    classifier_name: resnet50
    pretrained: true
    num_classes: 1000
    clip_name: openai/clip-vit-large-patch14
    diffusion_name: stabilityai/stable-diffusion-2-inpainting
  train:
    epochs: 50
    batch_size: 1024
    optimiser:
      lr: 0.0003
      weight_decay: 0.05
      betas:
      - 0.9
      - 0.999
    warmup_epochs: 5
    lambda_cer: 1.0
    refresh: 3
    prompts: 8
  seeds:
  - 0
  - 1
  - 2
exp2_waterbirds_vit:
  name: Waterbirds_ViT_B16
  dataset:
    hf_name: grodino/waterbirds
    url: https://huggingface.co/datasets/grodino/waterbirds
    split_files: {}
  model:
    classifier_name: vit_base_patch16_224
    pretrained: true
    num_classes: 2
    clip_name: openai/clip-vit-large-patch14
    diffusion_name: stabilityai/stable-diffusion-2-inpainting
  train:
    epochs: 90
    batch_size: 512
    optimiser:
      lr: 0.0003
      weight_decay: 0.05
      betas:
      - 0.9
      - 0.999
    warmup_epochs: 5
    lambda_cer: 1.0
    refresh: 5
    prompts: 8
  seeds:
  - 0
  - 1
  - 2
  - 3
  - 4
