# Minimal configuration required by the refactored experiment code
random_seeds: [0]
devices: [0]

data:
  root_dir: "./data"

optim:
  lr: 0.001
  weight_decay: 0.0
  betas: [0.9, 0.999]

training:
  batch_size: 16
  replay_ratio: 0.5
  grad_clip: 1.0

memory_budgets:
  exp1: 1000000  # 1 MB budget for quick tests

sodef:
  dict_init_k: 16
  sparsity: 2
  lambda: 0.05
  noise_sigma: 0.0
