exp_id: exp1_benchmark_real_graphs
description: |
  Experiment-1 End-to-end benchmark comparing GRADE-GNN versus various baselines on homophilic, heterophilic & large graphs.
datasets:
  - {name: Cora,      url: "https://huggingface.co/datasets/gcaillaut/cora"}
  - {name: Citeseer,  url: "https://example.invalid/citeseer"}
  - {name: Pubmed,    url: "https://example.invalid/pubmed"}
  - {name: Texas,     url: "https://example.invalid/texas"}
  - {name: Wisconsin, url: "https://example.invalid/wisconsin"}
  - {name: Chameleon, url: "https://huggingface.co/datasets/kzorluoglu/chameleon"}
models:
  - {name: gcn2,  type: GCN,   layers: 2,  hidden: 256}
  - {name: gcn64, type: GCN,   layers: 64, hidden: 256}
  - {name: gat,   type: GAT,   layers: 3,  hidden: 256}
  - {name: gcnII, type: GCNII, layers: 64, hidden: 256}

# ---------- optimisation & regularisation ----------------------------------
epochs: 800
lr: 0.01
weight_decay: 0.0005
dropout: 0.5
lambda_geo: 0.01
lambda_grad: 0.01
tau: 0.5
patience: 200
