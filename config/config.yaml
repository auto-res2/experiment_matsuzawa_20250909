# config/config.yaml – minimal smoke-test configuration extracted from the
# hard-coded ExperimentConfig instance in the original script.

name: "exp1_waterbirds_smoke"
dataset: "waterbirds"
seeds: [11]
rho_grid: [0.1]
model: "resnet50"
output_dir: ".research/iteration9"

optim:
  epochs: 3          # reduced for quick smoke test – original was 90
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.05
  betas: [0.9, 0.999]

dice:
  gc_eta: 0.05
